<!DOCTYPE html>
<html>
<head>
<style>
input:focus,
button:focus,
textarea:focus {
    outline: 4px solid orange;
    background-color: lightyellow;
}
</style>
</head>
<body>

<h2>Keyboard Accessibility Example</h2>

<input type="text" placeholder="Enter Name">
<br><br>

<textarea placeholder="Enter Message"></textarea>
<br><br>

<button>Submit</button>

</body>
</html>
