<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darshan University</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Times New Roman", serif;
            background-color: white;
        }

        /* Header */
        header {
            height: 138px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 7px 15px 25px;
            background-color: white;
        }

        .logo {
            width: 285px;
            height: auto;
        }

        nav {
            align-self: flex-start;
            margin-top: 5px;
            margin-right: 0;
        }

        nav a {
            color: #000066;
            text-decoration: none;
            font-size: 20px;
            margin-left: 14px;
        }

        /* Hero Section */
        .hero {
            height: 353px;
            background-color: #e7e7e7;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .hero-image {
            position: absolute;
            left: 40px;
            bottom: 0;
            width: 1030px;
            height: 330px;
            object-fit: contain;
            object-position: left bottom;
        }

        .hero-content {
            position: absolute;
            left: 45%;
            top: 45px;
            width: 650px;
        }

        .hero-content h1 {
            font-size: 32px;
            margin-bottom: 27px;
            font-weight: bold;
        }

        .hero-content p {
            font-size: 22px;
            line-height: 1.25;
        }

        /* Programs */
        .programs {
            height: 154px;
            display: flex;
            justify-content: space-between;
            padding: 18px 27px 0 27px;
            gap: 61px;
        }

        .program {
            height: 136px;
            flex: 1;
            border: 2px solid #b24a4a;
            text-align: center;
            color: #000066;
            font-size: 20px;
            padding-top: 1px;
        }

        @media screen and (max-width: 900px) {
            .hero-content {
                left: 40%;
                width: 55%;
            }

            .hero-content h1 {
                font-size: 26px;
            }

            .hero-content p {
                font-size: 18px;
            }

            .programs {
                gap: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <img src="du-logo.png" alt="Darshan University" class="logo">

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">My Work</a>
            <a href="#">Contact</a>
        </nav>
    </header>


    <!-- Hero Section -->
    <section class="hero">

        <img src="developer.png"
             alt="Web Developer"
             class="hero-image">

        <div class="hero-content">
            <h1>Hello,I am Web Developer</h1>

            <p>
                I use HTML and CSS to convert webpage designs into beautiful and efficient
                websites.
            </p>
        </div>

    </section>


    <!-- Programs -->
    <section class="programs">

        <div class="program">
            Program 1
        </div>

        <div class="program">
            Program 2
        </div>

        <div class="program">
            Program 3
        </div>

        <div class="program">
            Program 4
        </div>

    </section>

</body>
</html>
