<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 8 - Part A</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .page {
            width: 100%;
            height: 300px;
            background-color: lightblue;
            padding: 10px;
        }

        .page-title {
            height: 25px;
            font-size: 12px;
        }

        .header {
            height: 28px;
            background-color: purple;
            color: white;
            padding: 5px;
            font-size: 12px;
        }

        .content {
            height: 190px;
            background-color: orange;
            padding: 10px;
        }

        .entries {
            width: 60%;
            float: left;
        }

        .entry {
            height: 21px;
            background-color: black;
            color: white;
            margin-bottom: 12px;
            padding: 4px;
            font-size: 11px;
        }

        .sidebar {
            width: 32%;
            height: 80px;
            background-color: black;
            color: white;
            padding: 10px;
            font-size: 11px;
            float: right;
        }

        .footer {
            height: 15px;
            background-color: blue;
            color: white;
            padding: 2px;
            font-size: 10px;
            clear: both;
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="page-title">
            Page
        </div>

        <div class="header">
            Header
        </div>

        
        <div class="content">
            <div>Content</div>
            <div class="entries">
                <div class="entry">Entry</div>
                <div class="entry">Entry</div>
                <div class="entry">Entry</div>
            </div>

            <div class="sidebar">
                Sidebar
            </div>

        </div>

        <div class="footer">
            &copy;Darshan University-Rajkot
        </div>

    </div>

</body>
</html>
