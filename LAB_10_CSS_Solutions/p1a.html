<!DOCTYPE html>
<html>
<head>
<style>
div {
    width: 200px;
    height: 100px;
    background: red;
    animation: colorChange 4s infinite;
}

@keyframes colorChange {
    from { background: red; }
    to   { background: yellow; }
}
</style>
</head>
<body>

<div></div>

</body>
</html>
