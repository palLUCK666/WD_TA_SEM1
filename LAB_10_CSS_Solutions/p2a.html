<!DOCTYPE html>
<html>
<head>
<style>
.box {
    width: 100px;
    height: 100px;
    background: blue;
    position: relative;
    animation: moveBox 8s infinite;
}

@keyframes moveBox {
    0%   { left:0; top:0; }
    25%  { left:300px; top:0; }
    50%  { left:300px; top:300px; }
    75%  { left:0; top:300px; }
    100% { left:0; top:0; }
}
</style>
</head>
<body>

<div class="box"></div>

</body>
</html>
