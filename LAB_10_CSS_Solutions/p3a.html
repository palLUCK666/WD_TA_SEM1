<!DOCTYPE html>
<html>
<head>
<style>
.box {
    width:100px;
    height:100px;
    background:red;
    position:relative;

    animation: move 4s;
    animation-delay: 2s;
}

@keyframes move {
    from { left:0; }
    to   { left:300px; }
}
</style>
</head>
<body>

<div class="box"></div>

</body>
</html>
