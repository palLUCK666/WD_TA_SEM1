<!DOCTYPE html>
<html>
<head>
<style>
.box{
    width:100px;
    height:100px;
    background:orange;
    position:relative;

    animation: move 4s infinite;
    animation-direction: reverse;
}

@keyframes move{
    from{left:0;}
    to{left:300px;}
}
</style>
</head>
<body>

<div class="box"></div>

</body>
</html>
