<!DOCTYPE html>
<html>
<head>
<style>
.box{
    width:100px;
    height:100px;
    background:purple;
    position:relative;

    animation: move 5s infinite;
    animation-timing-function: linear;
}

@keyframes move{
    from{left:0;}
    to{left:500px;}
}
</style>
</head>
<body>

<div class="box"></div>

</body>
</html>
