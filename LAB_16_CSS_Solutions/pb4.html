<!DOCTYPE html>
<html>
<head>
    <title>Responsive Image</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-3">

    <!-- Left -->
    <img src="image.jpg" class="img-fluid float-start" width="200">

    <br><br><br><br><br><br>

    <!-- Center -->
    <img src="image.jpg" class="img-fluid d-block mx-auto" width="200">

    <br>

    <!-- Right -->
    <img src="image.jpg" class="img-fluid float-end" width="200">

</div>
</body>
</html>
