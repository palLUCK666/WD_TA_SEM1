<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bootstrap Typography</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-3">

    <!-- Highlighted text -->
    <h2>
        Welcome to
        <mark>Darshan University</mark>
    </h2>

    <br>

    <!-- Strikethrough -->
    <h2><del>Darshan Institute of Engineering and Technology</del></h2>

    <br>

    <!-- Another strikethrough -->
    <h2><s>Darshan Institute of Engineering and Technology</s></h2>

    <br>

    <!-- Underlined -->
    <h2><u>Darshan University-Rajkot</u></h2>

    <br>

    <!-- Another underlined -->
    <h2><ins>Darshan University-Rajkot</ins></h2>

    <br>

    <!-- Normal text -->
    <h2>Darshan University-Rajkot</h2>

    <br>

    <!-- Bold text -->
    <h2><strong>Darshan University-Rajkot</strong></h2>

    <br>

    <!-- Italic text -->
    <h2><em>Darshan University-Rajkot</em></h2>

</div>

</body>
</html>
