<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .linear1{
            float: left;
            position: relative;
            margin-left: 15%;
            height: 500px;
            width: 600px;
            background-image: linear-gradient(red,orange,yellow);
            margin-bottom: 50px; 
            border-radius: 10px;
            margin-top: 10%;
        }
        .linear2{
            height:500px;
            width: 600px;
            float: left;
            position: relative;
            margin-left: 20%;
            background-image: radial-gradient(  red 10%,
                orange 40%,
                yellow 50%,
                green 100%);
            border-radius: 10px;
            margin-top: 10%;
        }
    </style>
</head>
<body>
    <div class="linear1"></div>
    <div class="linear2"></div>
    
</body>
</html>
