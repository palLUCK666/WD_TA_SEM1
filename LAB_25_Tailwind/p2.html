<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Example</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100">

    <div class="max-w-sm mx-auto bg-white p-6 rounded-xl shadow-lg mt-10">

        <h2 class="text-2xl font-bold mb-3">
            Welcome
        </h2>

        <p class="text-gray-600 leading-relaxed">
            This is a simple card created using Tailwind CSS.
            It contains a heading, paragraph and button.
        </p>

        <button class="bg-blue-500 text-white px-5 py-2 rounded-lg mt-5 hover:bg-blue-700">
            Read More
        </button>

    </div>

</body>
</html>
