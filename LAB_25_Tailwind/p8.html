<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Signup</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100">

    <div class="max-w-md mx-auto p-8 bg-white rounded-xl shadow-lg text-center mt-10">

        <h2 class="text-2xl font-bold mb-3">
            Subscribe to Newsletter
        </h2>

        <p class="text-gray-600 mb-5">
            Get the latest updates directly in your inbox.
        </p>

        <input
            type="email"
            placeholder="Enter your email"
            class="border border-gray-300 p-3 w-full rounded-lg mb-4"
        >

        <button class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-800">
            Subscribe
        </button>

    </div>

</body>
</html>
