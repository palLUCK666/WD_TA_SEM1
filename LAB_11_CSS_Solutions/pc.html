<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 13 - C</title>

    <style>
        header .top-bar,
        footer .bottom-bar {
            background-color: black;
            height: 50px;
        }

        .header-box {
            background-color: red;
            margin-left: 370px;
            margin-right: 370px;
            text-align: center;
            color: white;
            height: 100px;
            font-size-adjust: calc(0.7);
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .left-box {
            background-color: white;
            color: rgb(217, 217, 7);
            font-size-adjust: calc(1);
            height: 400px;
            width: 370px;
            text-align: center;
            padding-top: 100px;
            float: left;
        }

        .nav-box {
            background-color: blue;
            color: white;
            height: 400px;
            width: 190px;
            font-size-adjust: calc(0.7);
            text-align: center;
            float: left;
        }

        .content-box {
            background-color: yellow;
            height: 400px;
            width: 550px;
            margin-right: 370px;
            font-size-adjust: calc(0.7);
            text-align: center;
            float: right;
        }

        .sidebar {
            background-color: green;
            color: white;
            border-left: 10px solid white;
            border-bottom: 10px solid white;
            font-size-adjust: calc(0.7);
            height: 250px;
            width: 200px;
            float: right;
        }

        .footer-box {
            background-color: rgb(10, 166, 228);
            margin-left: 370px;
            margin-right: 370px;
            text-align: center;
            font-size-adjust: calc(0.7);
            color: white;
            height: 100px;
            margin-top: 420px;
        }

        @media (max-width: 1500px) {
            .header-box {
                margin-left: 0;
                margin-right: 0;
            }

            .footer-box {
                margin-left: 0;
                margin-right: 0;
            }

            .center-box {
                margin-left: 10%;
                margin-right: 10%;
            }

            .left-box,
            .nav-box,
            .content-box {
                float: none;
                width: 100%;
                height: auto;
                padding: 30px 0;
            }

            .sidebar {
                position: static;
                width: 100%;
                border: none;
                margin-top: 20px;
            }
        }
    </style>

</head>

<body>

    <header>
        <div class="top-bar"></div>
    </header>

    <main>
        <div class="wrapper" style="height: 630px;">

            <div class="center-box header-box">
                <b>Header</b>
            </div>

            <div class="layout">

                <div class="left-box">
                    <i>HTML <br> Website <br> Layout</i>
                </div>

                <div class="nav-box">
                    <b>Navigation</b>
                </div>

                <div class="content-box">
                    <b>Content</b>

                    <div class="sidebar">
                        <b>Sidebar</b>
                    </div>
                </div>

            </div>

            <div class="footer-box">
                <b>Footer</b>
            </div>

        </div>
    </main>

    <footer>
        <div class="bottom-bar"></div>
    </footer>

</body>

</html>
