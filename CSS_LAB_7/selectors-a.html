<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Selectors - Part A</title>

    <style>
        /* Element selector */
        p {
            color: blue;
            font-family: Arial, sans-serif;
        }

        /* Class selector */
        .highlight {
            color: red;
            font-weight: bold;
        }

        /* Another class example */
        .box {
            border: 1px solid black;
            padding: 10px;
            margin-top: 10px;
        }

        /* ID selector */
        #mainTitle {
            color: green;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1 id="mainTitle">CSS Selectors - Part A</h1>

    <p>This paragraph is styled using the <b>element selector (p)</b>.</p>

    <p class="highlight">
        This paragraph uses the <b>class selector (.highlight)</b>.
    </p>

    <div class="box">
        This div uses the <b>class selector (.box)</b>.
    </div>

</body>
</html>
