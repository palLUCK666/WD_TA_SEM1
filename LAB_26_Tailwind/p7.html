<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Four Responsive Cards</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100">

    <h1 class="text-3xl font-bold text-center my-6">
        Our Cards
    </h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 p-6">

        <div class="w-full md:w-64 bg-white p-5 rounded-lg shadow-md">
            <h2 class="font-bold text-xl">Card 1</h2>
            <p class="mt-2 text-gray-600">
                This is the first card.
            </p>
        </div>

        <div class="w-full md:w-64 bg-white p-5 rounded-lg shadow-md">
            <h2 class="font-bold text-xl">Card 2</h2>
            <p class="mt-2 text-gray-600">
                This is the second card.
            </p>
        </div>

        <div class="w-full md:w-64 bg-white p-5 rounded-lg shadow-md">
            <h2 class="font-bold text-xl">Card 3</h2>
            <p class="mt-2 text-gray-600">
                This is the third card.
            </p>
        </div>

        <div class="w-full md:w-64 bg-white p-5 rounded-lg shadow-md">
            <h2 class="font-bold text-xl">Card 4</h2>
            <p class="mt-2 text-gray-600">
                This is the fourth card.
            </p>
        </div>

    </div>

</body>
</html>
