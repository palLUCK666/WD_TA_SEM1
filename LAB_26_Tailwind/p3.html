<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Layout</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>

    <div class="flex min-h-screen">

        <!-- Left Sidebar -->
        <div class="w-1/4 bg-gray-800 text-white p-6">

            <h2 class="text-2xl font-bold mb-6">
                Sidebar
            </h2>

            <p class="mb-4">Home</p>
            <p class="mb-4">About</p>
            <p class="mb-4">Services</p>
            <p class="mb-4">Contact</p>

        </div>

        <!-- Right Content -->
        <div class="w-3/4 bg-gray-100 p-6">

            <h1 class="text-3xl font-bold">
                Main Content
            </h1>

            <p class="mt-4 text-gray-700">
                This is the right content section.
                You can add text, images, cards and
                other website elements here.
            </p>

        </div>

    </div>

</body>
</html>
