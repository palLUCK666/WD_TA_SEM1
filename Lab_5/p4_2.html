<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>
</head>
<body>

<h2>Feedback Form</h2>

<form>

    Name:
    <input type="text"
           minlength="3"
           maxlength="20"
           required><br><br>

    Rating (1-10):
    <input type="number"
           min="1"
           max="10"
           required><br><br>

    Feedback:
    <textarea minlength="10"
              maxlength="200"
              required></textarea><br><br>

    <input type="submit" value="Send Feedback">

</form>

</body>
</html>
