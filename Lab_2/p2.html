    <title>Superscript and Subscript</title>

<body>

<h2>Mathematical Expressions</h2>

x<sup>2</sup> + y<sup>2</sup> = z<sup>2</sup>

<h2>Chemical Expressions</h2>

H<sub>2</sub>O <br>
CO<sub>2</sub> <br>
H<sub>2</sub>SO<sub>4</sub>
