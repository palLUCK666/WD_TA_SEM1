<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>
    <style>
        body { font-family: Arial; }
        form { width: 350px; padding: 20px; border: 1px solid #444; }
        input, textarea { width: 100%; padding: 8px; margin: 8px 0; }
        button { padding: 10px; }
    </style>
</head>
<body>

<h2>Feedback Form</h2>

<form>
    <!-- Name -->
    <label>Name:</label>
    <input type="text" required>

    <!-- Phone -->
    <label>Phone Number:</label>
    <input type="text" minlength="10" maxlength="10" required>

    <!-- Rating -->
    <label>Rating (1 to 5):</label>
    <input type="number" min="1" max="5" required>

    <!-- Feedback -->
    <label>Your Feedback:</label>
    <textarea minlength="10" maxlength="200" required></textarea>

    <button type="submit">Submit Feedback</button>
</form>

</body>
</html>
