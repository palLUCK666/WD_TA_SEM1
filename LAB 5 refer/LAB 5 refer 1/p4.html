<!DOCTYPE html>
<!--Design an HTML page that displays a video using the <video> tag with features like 
    controls, poster image, and multiple source formats.-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Demo</title>
</head>
<body>
    <h1>Video Tag Example</h1>

    <video width="480" height="270" controls poster="./tomAndJerryPoster.jpg">
        <source src="./Tom_AND_Jerry.mp4" type="video/mp4">    
        <source src="video-example.webm" type="video/webm">
         Your browser does not support the video tag. 
    </video>

    <p>Replace <code>video-example.mp4</code> and <code>poster-image.jpg</code> with your own files.</p>
</body>
</html>
