<!DOCTYPE html>
<!--
Design a webpage that implements meta tags to automatically refresh
after a few seconds, and specify the character encoding using the
charset meta tag.
-->
<html lang="en">
<head>
    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Auto refresh after 5 seconds -->
    <meta http-equiv="refresh" content="15">

    <title>Auto Refresh Page</title>
</head>
<body>
    <h1>Auto Refresh Demo</h1>
    <p>This page will refresh automatically every 5 seconds.</p>
    <P>Hi</P>
</body>
</html>
