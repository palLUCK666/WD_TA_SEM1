<!DOCTYPE html>
<!--Develop a webpage that embeds an audio file using the <audio> tag 
    with controls, autoplay, and loop attributes.-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audio Demo</title>
</head>
<body>
    <h1>Audio Tag Example</h1>

    <audio controls autoplay loop>
        <source src="WhatsApp Video 2025-12-11 at 1.35.35 AM.mp3" type="audio/mpeg">
        <source src="audio-example.ogg" type="audio/ogg">
        Your browser does not support the audio element.
    </audio>

    <p>audio-example</p>
</body>
</html>
