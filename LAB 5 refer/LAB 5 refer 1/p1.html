<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Basic meta tags -->
    <meta name="description" content="This is a sample webpage demonstrating basic meta tags.">
    <meta name="keywords" content="HTML, meta tags, description, keywords, viewport, author">
    <meta name="author" content="Your Name">

    <!-- Viewport for responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meta Tags Example</title>
</head>
<body>
    <h1>Meta Tags Demo</h1>
    <p>This page uses meta tags like description, keywords, author, and viewport.</p>
</body>
</html>

<!--
📌 What are meta tags?

Meta tags are hidden information placed inside the <head> section of an HTML document.
They are NOT displayed on the webpage, but browsers, search engines, and devices use them internally.
-->
