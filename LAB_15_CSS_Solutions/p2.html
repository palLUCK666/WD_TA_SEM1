<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Page UI</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #f5f5f5, #e9e9e9);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .container {
    display: flex;
    width: 900px;
    background: white;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    border-radius: 10px;
    overflow: hidden;
  }
  .left {
    width: 50%;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .left img {
    max-width: 100%;
    border-radius: 10px;
  }
  .right {
    width: 50%;
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 10px;
  }
  .reviews {
    color: #555;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .option {
    margin: 10px 0;
    display: flex;
    gap: 10px;
  }
  .option button {
    padding: 8px 20px;
    border: 1px solid #ccc;
    border-radius: 20px;
    cursor: pointer;
    background: white;
    transition: 0.3s;
  }
  .option button:hover {
    background: #e0e0e0;
  }
  .price-cart {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    background: #f5f5f5;
    border-radius: 10px;
    margin-top: 30px;
  }
  .price {
    font-size: 24px;
    font-weight: bold;
  }
  .cart-button {
    padding: 10px 20px;
    background: #2a6cff;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.3s;
  }
  .cart-button:hover {
    background: #1a4bcc;
  }
</style>
</head>
<body>
<div class="container">
  <div class="left">
    <img src="https://via.placeholder.com/400" alt="Product Image">
  </div>
  <div class="right">
    <h1>College Essentials</h1>
    <div class="reviews">⭐ 4.4 (328 reviews)</div>
    <div class="option">
      <span>Select Quality:</span>
      <button>Basic</button>
      <button>Premium</button>
    </div>
    <div class="option">
      <span>Style:</span>
      <button>Minimal</button>
      <button>Bohemian</button>
      <button>Floral</button>
      <button>Other</button>
    </div>
    <div class="option">
      <span>Color:</span>
      <button style="background: #009688;"></button>
      <button style="background: #212121;"></button>
      <button style="background: #ddd;"></button>
    </div>
    <div class="option">
      <span>Size:</span>
      <button>Twin XL</button>
      <button>Full</button>
    </div>
    <div class="price-cart">
      <div class="price">$195</div>
      <button class="cart-button">Add to Cart</button>
    </div>
  </div>
</div>
</body>
</html>
